apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal-alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portal-alloy
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portal-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portal-alloy
subjects:
  - kind: ServiceAccount
    name: portal-alloy
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-alloy
  labels:
    app.kubernetes.io/name: portal-alloy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-alloy
    spec:
      serviceAccountName: portal-alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.11.3
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
          env:
            - name: TEMPO_OTLP_ENDPOINT
              value: tempo:4317
            - name: LOKI_URL
              value: http://loki:3100/loki/api/v1/push
            - name: PROMETHEUS_REMOTE_WRITE_URL
              value: http://prometheus:9090/api/v1/write
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: http
              containerPort: 12345
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy
      volumes:
        - name: config
          configMap:
            name: portal-alloy-config
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: portal-alloy
  labels:
    app.kubernetes.io/name: portal-alloy
spec:
  selector:
    app.kubernetes.io/name: portal-alloy
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: http
      port: 12345
      targetPort: http
  type: ClusterIP
