apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The runtime Alloy collector is deployment-supplied in the observability
# namespace. Keep this bundle from creating a duplicate collector in default.

configMapGenerator:
  - name: portal-grafana-datasources
    files:
      - datasources.yaml=grafana/provisioning/datasources/datasources.yaml
    options:
      disableNameSuffixHash: true
  - name: portal-grafana-dashboard-provider
    files:
      - dashboards.yaml=grafana/provisioning/dashboards/dashboards.yaml
    options:
      disableNameSuffixHash: true
  - name: portal-grafana-dashboards
    files:
      - portal-status.json=grafana/dashboards/portal-status.json
    options:
      disableNameSuffixHash: true
